<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G14 - Mundo 2.5D</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/css/batalha.css">
<style>
  :root{--ink:#0b0f14;--surface:#111821;--border:#243040;--text:#f1f4f8;--muted:#8a97a8;--jade:#12b7a3;--amber:#f2b84b;
    --mono:ui-monospace,"IBM Plex Mono",SFMono-Regular,Menlo,Consolas,monospace;--sans:ui-sans-serif,system-ui,"Inter","Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:13px;overflow:hidden}
  #jogo{position:fixed;inset:0}
  #jogo canvas{display:block}
  .hud{position:fixed;top:12px;left:12px;width:250px;padding:12px 14px;background:rgba(17,24,33,.9);border:1px solid var(--border);border-radius:10px;z-index:5;pointer-events:none}
  .hud h1{margin:0 0 8px;font-size:13px;letter-spacing:.02em}
  .hud h1 small{color:var(--muted);font-weight:500;margin-left:6px}
  .linha{display:flex;justify-content:space-between;gap:10px;margin:3px 0}
  .linha span:first-child{color:var(--muted)}
  .linha b{font:600 12px var(--mono)}
  .barra{height:6px;background:#1c2736;border-radius:3px;margin:2px 0 6px;overflow:hidden}
  .barra i{display:block;height:100%;width:100%;background:var(--jade);transition:width .15s}
  #hud-msg{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:var(--amber);min-height:34px}
  .aviso{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:var(--muted);font:14px var(--mono);z-index:6}
  .dica{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 24px);padding:8px 14px;background:#0f1722;border:1px solid #3a4a60;border-radius:10px;color:#f1f4f8;font:12px/1.5 var(--sans);text-align:center;z-index:5;pointer-events:none}
  .dica kbd{margin:0 1px}
  .dica .sep{color:#6d7c90;margin:0 6px}
  .faixa-derrota{position:fixed;top:16px;left:50%;transform:translateX(-50%);max-width:min(560px,calc(100% - 24px));padding:10px 16px;background:rgba(40,22,26,.96);border:1px solid #c0525a;border-left:4px solid #ef4a52;border-radius:10px;z-index:30;font:13px/1.45 var(--sans);box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .faixa-derrota[hidden]{display:none}
  .faixa-derrota b{display:block;color:#ff8a90;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
  kbd{font:600 11px var(--mono);background:#172130;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--text)}
</style>
</head>
<body>
<div id="jogo"></div>
<div id="aviso" class="aviso"></div>
<div id="faixa-derrota" class="faixa-derrota" hidden></div>
<aside class="hud">
  <h1>Mundo 2.5D<small>T3</small></h1>
  <div class="linha"><span>HP do time</span><b id="hud-hp">-</b></div>
  <div class="barra"><i id="hud-barra"></i></div>
  <div class="linha"><span>Em campo</span><b id="hud-time">-</b></div>
  <div class="linha"><span>Mochila</span><b id="hud-bolas">-</b></div>
  <div class="linha"><span>Dinheiro</span><b id="hud-dinheiro">-</b></div>
  <div class="linha"><span>Lideres</span><b id="hud-lideres">-</b></div>
  <div class="linha"><span>Surf</span><b id="hud-surf">-</b></div>
  <div class="linha"><span>Posicao</span><b id="hud-pos">-</b></div>
  <div class="linha"><span>Centros no mapa</span><b id="hud-centros">-</b></div>
  <div id="hud-msg"></div>
</aside>
<div class="dica"><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd> ou <kbd>WASD</kbd> andam no grid: cima/baixo trocam de linha, esquerda/direita de coluna<span class="sep">|</span>roda do mouse = zoom</div>
<script src="/static/vendor/phaser.min.js"></script>
<script type="module" src="/static/js/mundo/main.js"></script>
</body>
</html>
